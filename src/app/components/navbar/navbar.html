<header
  class="flex min-h-[68px] items-center justify-between gap-4 rounded-2xl bg-white p-4 text-[#111928] max-[540px]:gap-3 max-[540px]:px-3"
>
  <div class="flex min-w-0 items-center gap-3 max-[540px]:gap-2">
    <ng-content select="[navbar-leading]" />
    @if (pageTitle()) {
      <span class="navbar-title truncate text-sm font-medium text-gray-700">{{ pageTitle() }}</span>
    } @else {
      <div
        class="flex items-center gap-3 text-2xl leading-8 font-semibold max-[540px]:gap-2 max-[540px]:text-xl"
      >
        <img [src]="logo" alt="" width="32" height="32" class="shrink-0" />
        <span>Flowbite</span>
      </div>
    }
  </div>

  <div class="flex shrink-0 items-center gap-3 max-[540px]:gap-2">
    <ng-content select="[navbar-actions]" />
      <button
        type="button"
        class="inline-flex min-h-[34px] cursor-pointer items-center justify-center gap-2 rounded-lg border border-gray-200 bg-white px-3 py-2 text-xs leading-4 text-[#111928] hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1C64F2]"
        aria-label="Language: English"
      >
        <img [src]="english" alt="English" width="16" height="16" />

        <span>English</span>
        <svg class="size-3 shrink-0" aria-hidden="true" viewBox="0 0 12 12" fill="none">
          <path
            d="m3 4.5 3 3 3-3"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    <ng-content select="[navbar-user-menu]" />
  </div>
</header>
