<dialog
  #dialog
  aria-labelledby="main-wallet-title"
  class="m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-[560px] overflow-y-auto overscroll-contain rounded-2xl border border-gray-100 bg-white p-4 text-gray-900 backdrop:bg-black/55 sm:p-6"
  (cancel)="close($event)"
>
  <header class="flex items-start justify-between gap-4 border-b border-gray-100 pb-5">
    <div>
      <h2 id="main-wallet-title" class="text-xl font-bold">Main Wallet</h2>
      <span
        class="mt-1.5 inline-block rounded-md bg-emerald-100 px-3 py-1 text-xs font-medium text-emerald-900"
      >
        Wallet
      </span>
    </div>
    <button
      type="button"
      aria-label="Close Main Wallet"
      class="grid size-9 shrink-0 cursor-pointer place-items-center rounded-lg border border-gray-200 hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1C64F2]"
      (click)="close()"
    >
      <img src="svg/icon/x.svg" alt="" class="size-3" />
    </button>
  </header>

  <dl class="my-5 flex flex-wrap items-center justify-between gap-x-4 gap-y-1">
    <dt class="text-sm text-gray-500">Available Balance</dt>
    <dd
      class="min-w-0 text-[28px] leading-tight font-bold wrap-anywhere text-[#1C64F2] tabular-nums"
    >
      {{ balanceLabel() }}
    </dd>
  </dl>

  <div class="grid grid-cols-1 gap-2 min-[440px]:grid-cols-3">
    <app-button
      variant="secondary"
      size="compact"
      icon="svg/icon/circle-arrow-down.svg"
      [disabled]="true"
    >
      Deposit
    </app-button>
    <app-button
      variant="secondary"
      size="compact"
      icon="svg/icon/circle-arrow-up.svg"
      [disabled]="true"
    >
      Withdraw
    </app-button>
    <app-button variant="secondary" size="compact" icon="svg/icon/history.svg" [disabled]="true">
      Transaction
    </app-button>
  </div>
</dialog>
