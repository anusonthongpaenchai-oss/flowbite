<dialog
  #dialog
  [attr.aria-labelledby]="challenge() ? 'wallet-password-otp-title' : 'wallet-password-title'"
  [attr.aria-busy]="busy()"
  class="m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-[436px] overflow-y-auto overscroll-contain rounded-xl border-0 bg-white p-0 text-gray-900 backdrop:bg-black/35"
  (cancel)="cancel($event)"
>
  @if (challenge(); as otpChallenge) {
    <app-confirm-password-wallet
      [challenge]="otpChallenge"
      [busy]="busy()"
      [error]="error()"
      (cancelled)="cancel()"
      (verified)="verify($event)"
    />
  } @else {
    @let wallet = account();
    <form class="flex max-h-[min(422px,calc(100dvh-2rem))] flex-col" (submit)="confirm($event)">
      <header
        class="flex min-h-[62px] shrink-0 items-center justify-between border-b border-gray-200 px-5"
      >
        <h2 id="wallet-password-title" class="text-base font-bold text-[#10106b]">
          Change {{ type() === 'main' ? 'Master' : 'Investor' }} Password
        </h2>
        <app-button
          variant="ghost"
          size="compact"
          icon="svg/icon/x.svg"
          class="-mr-1 [&_img]:size-4 [&_img]:opacity-40"
          [disabled]="busy()"
          (onClick)="cancel()"
        >
          <span class="sr-only">Close change password</span>
        </app-button>
      </header>

      <div class="min-h-0 overflow-y-auto overscroll-contain p-5">
        <div
          class="grid gap-5 [&_input:disabled]:h-10 [&_input:disabled]:border-gray-200 [&_input:disabled]:bg-gray-100/70 [&_input:disabled]:px-3 [&_input:disabled]:py-0 [&_input:disabled]:text-gray-400 [&_label]:gap-1.5 [&_label>span:first-child]:text-[10px] [&_label>span:first-child]:leading-3 [&_label>span:first-child]:text-gray-600"
        >
          <app-input label="Account Name" [value]="wallet.wallet_account_name" [disabled]="true" />
          <app-input label="Account Number" [value]="wallet.wallet_account_no" [disabled]="true" />
          <app-input label="Account Type" [value]="wallet.wallet_type" [disabled]="true" />
        </div>

        <div class="mt-5 grid gap-2">
          <label for="wallet-new-password" class="text-xs font-medium text-gray-600">
            New Password <span class="text-[#10106b]" aria-hidden="true">*</span>
          </label>
          <div class="relative">
            <img
              [src]="visible() ? 'svg/icon/lock-open-glass.svg' : 'svg/icon/lock-glass.svg'"
              alt=""
              class="pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2 opacity-45"
            />
            <input
              id="wallet-new-password"
              [type]="visible() ? 'text' : 'password'"
              autocomplete="new-password"
              placeholder="New Password"
              aria-describedby="wallet-password-rule"
              required
              [value]="password()"
              [disabled]="busy()"
              [attr.aria-invalid]="password() && !hasSpecialCharacter() ? 'true' : null"
              (input)="password.set(passwordInput.value)"
              #passwordInput
              class="h-10 w-full rounded-lg border border-gray-200 bg-white pr-10 pl-8 text-sm font-medium placeholder:text-gray-400 focus-visible:outline-2 focus-visible:outline-[#1c64f2]"
            />
            <button
              type="button"
              [attr.aria-label]="visible() ? 'Hide new password' : 'Show new password'"
              [attr.aria-pressed]="visible()"
              [disabled]="busy()"
              (click)="visible.set(!visible())"
              class="absolute inset-y-0 right-1 grid w-8 cursor-pointer place-items-center rounded-md focus-visible:outline-2 focus-visible:outline-[#1c64f2] disabled:cursor-not-allowed"
            >
              <img src="svg/icon/eye.svg" alt="" class="size-4" />
            </button>
          </div>
          <p
            id="wallet-password-rule"
            class="text-xs text-gray-600"
            [class.text-red-700]="password() && !hasSpecialCharacter()"
          >
            Use at least one special character, such as &#64;, !, or #.
          </p>
        </div>

        <label class="mt-5 grid gap-2 text-xs font-medium text-gray-600">
          <span
            >Get verification code (OTP) by
            <span class="text-[#10106b]" aria-hidden="true">*</span></span
          >
          <span class="relative">
            <select
              #otpMethod
              required
              [value]="method()"
              [class.text-gray-400]="!method()"
              [disabled]="busy()"
              (change)="selectMethod(otpMethod.value)"
              class="h-9 w-full appearance-none rounded-lg border border-gray-300 bg-white pr-9 pl-3 focus-visible:outline-2 focus-visible:outline-[#1c64f2]"
            >
              <option value="" disabled>GET OTP BY</option>
              <option value="sms">SMS</option>
              <option value="email">Email</option>
              <option value="totp">Authenticator</option>
            </select>
            <svg
              aria-hidden="true"
              viewBox="0 0 12 12"
              class="pointer-events-none absolute top-1/2 right-4 size-3 -translate-y-1/2 text-gray-400"
            >
              <path d="m2.5 4.5 3.5 3.5 3.5-3.5" fill="none" stroke="currentColor" />
            </svg>
          </span>
        </label>
      </div>

      <footer class="shrink-0 border-t border-gray-200 p-5">
        @if (error()) {
          <p role="alert" class="mb-3 text-sm wrap-anywhere text-red-700">{{ error() }}</p>
        }
        <div class="flex flex-wrap justify-end gap-2.5">
          <app-button
            variant="secondary"
            class="[&_button]:h-9 [&_button]:py-0"
            [disabled]="busy()"
            (onClick)="cancel()"
            >Cancel</app-button
          >
          <button
            type="submit"
            [disabled]="busy() || !hasSpecialCharacter() || !method()"
            class="h-9 cursor-pointer rounded-lg bg-[#10106b] px-5 text-sm font-semibold text-white enabled:hover:bg-[#1b2385] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1c64f2] disabled:cursor-not-allowed disabled:opacity-45"
          >
            {{ busy() ? 'Sending…' : 'Confirm' }}
          </button>
        </div>
      </footer>
    </form>
  }
</dialog>
