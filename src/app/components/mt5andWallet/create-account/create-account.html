<dialog
  #dialog
  id="create-wallet-dialog"
  class="m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-[520px] overflow-y-auto overscroll-contain rounded-2xl border border-gray-200 bg-white p-5 text-gray-900 backdrop:bg-black/55 sm:p-6"
  aria-labelledby="create-wallet-title"
  [attr.aria-busy]="submitting()"
  (cancel)="onCancel($event)"
>
  <div class="flex items-start justify-between gap-3 border-b border-gray-100 pb-4">
    <div>
      <h2 id="create-wallet-title" class="text-xl leading-tight font-bold">
        {{ type() === 'demo' ? 'Open Demo Account' : 'Open Live Account' }}
      </h2>
      <span
        class="mt-2 inline-flex rounded-md bg-emerald-100 px-2.5 py-1 text-xs font-medium text-emerald-900"
      >
        Wallet
      </span>
    </div>
    <button
      type="button"
      class="grid size-9 shrink-0 cursor-pointer place-items-center rounded-lg border border-gray-200 hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:opacity-50"
      aria-label="Close"
      [disabled]="submitting()"
      (click)="close()"
    >
      <img src="svg/icon/x.svg" width="12" height="12" alt="" />
    </button>
  </div>

  <form class="mt-5" [formGroup]="form" (ngSubmit)="submit()">
    <fieldset class="grid min-w-0 gap-4" [disabled]="submitting()">
      <label class="flex flex-col gap-2 text-sm font-medium">
        Account Type
        <span class="select-field relative">
          <select
            class="w-full appearance-none rounded-lg border border-gray-300 bg-gray-50 py-2.5 pr-10 pl-4 text-sm leading-5 focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600"
            formControlName="accountType"
            required
            autofocus
          >
            <option [ngValue]="null" disabled>Please select</option>
            @for (option of accountTypes; track option.id) {
              <option [ngValue]="option.id">{{ option.label }}</option>
            }
          </select>
        </span>
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium">
        Leverage
        <span class="select-field relative">
          <select
            class="w-full appearance-none rounded-lg border border-gray-300 bg-gray-50 py-2.5 pr-10 pl-4 text-sm leading-5 focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600"
            formControlName="leverage"
            required
          >
            <option [ngValue]="null" disabled>
              @if (form.controls.accountType.value === null) {
                Select an account type first
              } @else if (leverageLoadFailed()) {
                Leverage unavailable
              } @else if (leverageOptions() === null) {
                Loading leverage…
              } @else if (!leverageOptions()?.length) {
                No leverage available
              } @else {
                Please select
              }
            </option>
            @for (option of leverageOptions() ?? []; track option) {
              <option [ngValue]="option">1:{{ option }}</option>
            }
          </select>
        </span>
      </label>

      @if (leverageLoadFailed()) {
        <div class="flex flex-wrap items-center gap-x-2 text-sm">
          <p role="alert" class="text-red-700">Unable to load leverage options.</p>
          <button
            type="button"
            class="cursor-pointer text-blue-700 underline"
            (click)="loadLeverages()"
          >
            Retry
          </button>
        </div>
      }

      <app-input
        label="Account Name (Optional)"
        placeholder="Enter account name"
        formControlName="accountName"
      />

      <app-checkbox
        class="[&_label]:items-start [&_label>span:first-child]:mt-0.5 [&_label>span:last-child]:font-normal [&_label>span:last-child]:text-gray-900"
        label="I have read and agree to the Terms and Conditions, Order Execution Policy, Risk Information, Conflict of Interest Policy, and Privacy Policy."
        formControlName="terms"
      />
    </fieldset>

    @if (errorMessage()) {
      <p class="mt-3 text-sm text-red-700" role="alert">{{ errorMessage() }}</p>
    }

    <div
      class="mt-5 grid grid-cols-2 gap-3 [&_button]:h-full [&_button:disabled]:cursor-not-allowed [&_button:disabled]:opacity-50"
    >
      <app-button variant="secondary" [disabled]="submitting()" (onClick)="close()"
        >Cancel</app-button
      >
      <app-button
        type="submit"
        [disabled]="form.invalid || !leverageOptions()?.length || submitting() || needsRefresh()"
      >
        {{ submitting() ? 'Opening…' : 'Open An Account' }}
      </app-button>
    </div>
  </form>
</dialog>
