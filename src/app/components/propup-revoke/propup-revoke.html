<dialog
  #dialog
  class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl border border-gray-200 bg-white p-5 text-[#111928] backdrop:bg-black/35 sm:p-6"
  aria-labelledby="revoke-title"
  aria-describedby="revoke-description"
  [attr.aria-busy]="busy()"
  (cancel)="cancel($event)"
>
  <header class="flex items-center gap-3 border-b border-gray-200 pb-4">
    <img src="svg/icon/logout.svg" alt="" class="size-6" />
    <h2 id="revoke-title" class="text-lg font-bold">Sign out?</h2>
  </header>
  <p id="revoke-description" class="mt-4 text-sm text-gray-600">
    Are you sure you want to sign out of {{ browser() || 'an unknown browser' }} on
    {{ device() || 'an unknown device' }}?
  </p>
  @if (error()) {
    <p role="alert" class="mt-3 text-sm text-red-700">{{ error() }}</p>
  }
  <div
    class="mt-5 flex flex-wrap justify-end gap-3 [&>button]:rounded-lg [&>button]:px-4 [&>button]:py-2.5 [&>button]:text-sm [&>button]:font-medium [&>button]:enabled:cursor-pointer [&>button]:focus-visible:outline-2 [&>button]:focus-visible:outline-offset-2 [&>button]:focus-visible:outline-[#1C64F2] [&>button]:disabled:opacity-60"
  >
    <button
      type="button"
      class="border border-gray-200 enabled:hover:bg-gray-50"
      [disabled]="busy()"
      (click)="cancel()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="bg-[linear-gradient(89.87deg,#0a136a_-17.83%,#00d4fc_141.24%)] text-white enabled:hover:brightness-110"
      [disabled]="busy()"
      (click)="confirmed.emit()"
    >
      {{ busy() ? 'Signing out…' : 'Confirm' }}
    </button>
  </div>
</dialog>
