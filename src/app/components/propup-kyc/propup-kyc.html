<dialog
  #dialog
  id="wallet-kyc-dialog"
  class="m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-[448px] overflow-y-auto overscroll-contain rounded-2xl border border-gray-200 bg-white p-5 text-center text-[#111928] backdrop:bg-black/35 sm:p-6"
  aria-labelledby="wallet-kyc-title"
  aria-describedby="wallet-kyc-description"
  (cancel)="close($event)"
>
  <div
    class="mx-auto grid size-16 place-items-center rounded-full bg-[#ffe3d5] text-[#ff5700]"
    aria-hidden="true"
  >
    <svg
      class="size-7"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path
        d="M10.3 3.7 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0ZM12 9v4m0 4h.01"
      />
    </svg>
  </div>
  <h2 id="wallet-kyc-title" class="mt-4 text-xl font-bold sm:text-2xl">
    {{
      verificationRequired()
        ? 'Identity Verification Required'
        : 'Unable to check identity verification'
    }}
  </h2>
  <p id="wallet-kyc-description" class="mt-4 text-sm font-medium text-gray-500 sm:text-base">
    {{
      verificationRequired()
        ? 'Please complete your identity verification (KYC) first.'
        : 'Please try opening MT5 & Wallet again in a moment.'
    }}
  </p>
  <div class="mt-5 grid gap-4">
    @if (verificationRequired()) {
      <button
        type="button"
        class="min-h-10 cursor-pointer rounded-full bg-linear-to-r from-[#d71c1c] to-[#a00000] px-4 py-2 text-sm font-semibold text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-700"
        (click)="confirm()"
      >
        Confirm identity
      </button>
    }
    <button
      type="button"
      class="min-h-10 cursor-pointer rounded-full border border-gray-200 px-4 py-2 text-sm font-semibold text-gray-600 shadow-xs hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
      (click)="close()"
    >
      Close
    </button>
  </div>
</dialog>
