<dialog
  #dialog
  aria-labelledby="delete-account-title"
  aria-describedby="delete-account-description"
  class="relative m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-[336px] overflow-y-auto rounded-2xl border-0 bg-white px-8 py-8 text-center text-gray-900 backdrop:bg-black/35"
  [attr.aria-busy]="pending()"
  (cancel)="cancel($event)"
>
  <button
    type="button"
    aria-label="Cancel deletion"
    class="absolute top-4 right-4 grid size-6 cursor-pointer place-items-center rounded text-gray-400 hover:text-gray-600 focus-visible:outline-2 focus-visible:outline-[#10106B] disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="pending()"
    (click)="cancel()"
  >
    <img src="svg/icon/x.svg" alt="" class="size-5 opacity-40" />
  </button>

  <span class="relative mx-auto block size-[72px] rounded-full bg-[#FFBB33]" aria-hidden="true">
    <span
      class="absolute top-[19px] left-1/2 h-[26px] w-[7px] -translate-x-1/2 rounded-full bg-white"
    ></span>
    <span
      class="absolute bottom-[18px] left-1/2 size-[7px] -translate-x-1/2 rounded-full bg-white"
    ></span>
  </span>
  <h2 id="delete-account-title" class="mt-10 text-xl font-bold">Delete Account</h2>
  <p id="delete-account-description" class="mt-3 text-lg leading-[26px] text-gray-600">
    Are you sure you want to delete account?
  </p>

  @if (error()) {
    <p role="alert" class="mt-4 text-sm text-red-600">{{ error() }}</p>
  }

  <div class="mt-8 flex justify-center gap-3">
    <button
      type="button"
      autofocus
      class="min-h-[38px] cursor-pointer rounded-lg border border-gray-300 px-6 py-2 text-xs font-medium text-gray-700 hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#10106B] disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="pending()"
      (click)="cancel()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="min-h-[38px] cursor-pointer rounded-lg bg-[#10106B] px-6 py-2 text-xs font-semibold text-white hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#10106B] disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="pending()"
      (click)="confirm()"
    >
      {{ pending() ? 'Deleting…' : 'Yes, delete' }}
    </button>
  </div>
</dialog>
