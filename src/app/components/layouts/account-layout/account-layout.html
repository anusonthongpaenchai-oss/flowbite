<div
  class="account-page text-[length:clamp(10px,1.2vw,14px)] leading-[1.5] [@media(max-width:600px)]:text-[13px]"
>
  <main
    class="account-panel rounded-xl border border-[#f0f1f3] bg-white px-[9px] pt-3 pb-[9px] min-[1000px]:px-4 min-[1000px]:pt-5 min-[1000px]:pb-4 [@media(max-width:600px)]:px-3 [@media(max-width:600px)]:pt-4 [@media(max-width:600px)]:pb-3"
    aria-labelledby="account-title"
  >
    <h1 id="account-title" class="text-[1.05em] font-bold">User Account</h1>

    <nav
      class="account-tabs mt-[13px] flex gap-4 overflow-x-auto border-b border-b-[#edf0f3] text-[0.9em] whitespace-nowrap text-[#6b7280] min-[1000px]:mt-5 min-[1000px]:gap-6 [@media(max-width:600px)]:mt-4 [@media(max-width:600px)]:gap-[18px]"
      aria-label="Account sections"
    >
      @for (tab of tabs; track tab.url) {
        <a
          class="border-b border-transparent pb-2 no-underline hover:text-[#0057ff] focus-visible:outline-offset-3 focus-visible:[outline:2px_solid_#1c64f2]"
          [routerLink]="tab.url"
          routerLinkActive="active-tab border-b-[#316bff] text-[#0057ff]"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
        >
          {{ tab.label }}
        </a>
      }
    </nav>

    <router-outlet></router-outlet>
  </main>
</div>
