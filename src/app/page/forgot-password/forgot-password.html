<section
  class="flex min-h-dvh flex-col gap-4 bg-[#ebf5ff] p-4 text-[#111928] max-[540px]:gap-3 max-[540px]:p-3"
>
  <app-navbar></app-navbar>

  <main
    class="flex flex-1 items-center justify-between gap-20 rounded-2xl bg-white p-16 max-[1100px]:justify-center max-[1100px]:px-6 max-[1100px]:py-12 max-[540px]:px-4 max-[540px]:py-8"
  >
    <div class="min-w-0 flex-[1_1_768px] max-[1100px]:hidden" aria-hidden="true">
      <img
        [src]="illustration"
        alt=""
        width="672"
        height="543"
        class="block h-auto w-full max-w-[768px]"
      />
    </div>

    <form
      [formGroup]="forgotPasswordForm"
      (ngSubmit)="onSubmit()"
      [attr.aria-busy]="isSubmitting()"
      aria-labelledby="forgot-password-title"
      class="flex w-full min-w-0 max-w-[570px] flex-[0_0_570px] flex-col gap-6 rounded-2xl border border-[#f0f1f3] p-8 max-[1100px]:basis-auto max-[540px]:px-4 max-[540px]:py-6"
      novalidate
    >
      <app-button
        class="self-start"
        variant="secondary"
        type="button"
        icon="svg/icon/Vector.svg"
        routerLink="/"
        [disabled]="isBusy()"
      >
        Back
      </app-button>

      <div class="flex flex-col gap-2">
        <h1
          id="forgot-password-title"
          class="text-[28px] leading-9 font-bold max-[540px]:text-2xl max-[540px]:leading-8"
        >
          Reset you Password
        </h1>
        <p class="text-lg leading-7 text-[#6b7280] max-[540px]:text-base max-[540px]:leading-6">
          We will send an email to reset your password if you can no longer access your email.
        </p>
      </div>

      <app-input
        formControlName="email"
        type="email"
        label="Email"
        placeholder="Enter your email"
        [error]="emailError()"
        [readOnly]="isBusy()"
      ></app-input>

      @if (errorMessage()) {
        <p role="alert" class="text-sm text-red-600">{{ errorMessage() }}</p>
      }
      @if (successMessage()) {
        <p role="status" class="text-sm text-green-700">{{ successMessage() }}</p>
      }

      <app-button class="w-full" variant="primary" type="submit" [disabled]="isBusy()">
        {{ isSubmitting() ? 'Sending…' : 'Next' }}
      </app-button>
    </form>
  </main>
</section>
